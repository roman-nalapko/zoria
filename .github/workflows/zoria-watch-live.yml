name: Zoria live watcher

on: workflow_dispatch

permissions:
  actions: write
  contents: read

concurrency:
  group: zoria-live-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      NOTIFY_HEALTH: 'true'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ZORIA_DISPLAY_NAME: Zoria
      ZORIA_INVITATION: ${{ secrets.ZORIA_INVITATION }}
      ZORIA_PASSWORD: ${{ secrets.ZORIA_PASSWORD }}
      ZORIA_REPOSITORY_URL: https://github.com/roman-nalapko/zoria
      ZORIA_USERNAME: roman-nalapko
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:worker
      - name: Watch every ten minutes
        run: |
          for check in $(seq 1 34); do
            node dist-worker/worker/once.js
            state=$(gh api repos/${GITHUB_REPOSITORY}/actions/workflows/zoria-watch-live.yml --jq .state)
            if [ "$state" != "active" ]; then
              exit 0
            fi
            if [ "$check" -lt 34 ]; then
              sleep 600
            fi
          done
          gh workflow run zoria-watch-live.yml --ref main
