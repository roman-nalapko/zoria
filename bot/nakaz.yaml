# експансія ("expansion"): take cell after cell
#
# A growth profile. A full swarm, the thread reaches for the nearest CLUSTER of
# ruins - where three unowned ones stand side by side, the Keeper reveals a
# contract. A scan once a minute keeps the contact map fresh and yields the
# channel when it runs short (priority: drop-on-budget).
nakaz: 1
name: 'експансія'
rules:
  - do: hold_net
  - when: 'my_drones < 4'
    do: { build_drone: { cls: tkach, upto: 4 } }
  - do: { extend_to: { target: nearest_cluster } }
  - when: 'every 60'
    do: { scan_at: { target: densest_contacts, every: 60 } }
    priority: drop-on-budget
