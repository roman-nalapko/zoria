    evs.push({ t: j[0], type: 'jam', p: P.A, q: j[1], r: j[2], dur: j[3] });
  });
  if (cfg.intercept === 'take') {
    evs.push({ t: 176, type: 'cap', p: P.B, from: P.A, q: 9, r: -8 });
  } else evs.push({ t: 176, type: 'jam', p: P.A, q: 9, r: -8, dur: 18 });
  cfg.ringCaps.forEach(function (rc) {
    evs.push({
      t: rc[0],
      type: 'cap',
      p: P.C,
      q: rc[1],
      r: rc[2],
      ring: true,
      bonus: 3,
    });
  });
  const shares = GAME_SHARES[n];
  const order3 = PLAYERS.slice().sort(function (x, y) {
    return shares[y] - shares[x];
  });
  [
    { t: 80, type: 'order' },
    { t: 100, type: 'crown0', p: P.C },
    { t: 130, type: 'crown', p: P.C, bonus: 4 },
    { t: 140, type: 'pact' },
    { t: 168, type: 'cut', p: P.A },
    { t: 190, type: 'shout', p: P.A },
    { t: 200, type: 'orderDone', p: P.A, bonus: 6 },
    { t: 210, type: 'ram', p: P.B },
    { t: 235, type: 'break', p: P.B },
    { t: 247, type: 'pactEnd' },
    { t: 260, type: 'mercy', p: P[cfg.mercy] },
    { t: 300, type: 'note' },
    { t: 360, type: 'end' },
  ].forEach(function (e) {
    evs.push(e);
  });
  evs.sort(function (a, b) {
    return a.t - b.t;
  });
  /* ===== P71: feed text is no longer here =====
     The evening-recording event, like the live-battle event, carries FIELDS and a string key,
     and the display assembles the phrase from them (evText). Before, the string was assembled here, and
     it contained the slot letter - there was nothing to replace it with a nickname: the match generator
     lives in the core and knows nothing about participant names.

     Thread link numbers are computed by the same logic as in deriveState, and go as
     the fields no / noFrom: they are part of the needle's name, not the player's */
  const counters = { A: 2, B: 2, C: 2 };
  const nums = {};
  PLAYERS.forEach(function (p) {
    SEAT_CHAIN[invSeat(P, p)].forEach(function (k, i) {
      nums[k] = { p: p, no: i + 1 };
    });
  });
  evs.forEach(function (ev) {
    ev.key = 'rec.' + ev.type;
    if (ev.type !== 'cap') return;
    const k = hexKey(ev.q, ev.r);
    counters[ev.p]++;
    const was = nums[k];
    if (ev.from && was) {
      ev.from = was.p;
      ev.noFrom = was.no;
    }
    ev.no = counters[ev.p];
    ev.key = ev.from ? 'rec.cap.from' : ev.ring ? 'rec.cap.ring' : 'rec.cap';
    nums[k] = { p: ev.p, no: ev.no };
  });
  /* Jamming addresses the needle by its owner's link number - only this
     numbering knows it, so the second pass runs after it has been fully built */
  evs.forEach(function (ev) {
    if (ev.type !== 'jam') return;
    const was = nums[hexKey(ev.q, ev.r)];
    if (was) {
      ev.own = was.p;
      ev.no = was.no;
    }
    ev.key = was ? 'rec.jam' : 'rec.jam.at';
  });
  /* Two events name not one participant, but several: the pact - both
     sides, the closing of the match - the entire share order. The display will substitute the names for them */
  evs.forEach(function (ev) {
    if (ev.type === 'pact') {
      ev.a = P.B;
      ev.b = P.C;
    } else if (ev.type === 'end') ev.order3 = order3.slice();
  });
  return {
    evs: evs,
    cut: { from: 168, to: 190, keepIdx: 2, p: P.A },
    pact: {
      from: 140,
      to: 247,
      blink: 235,
      tax: 0.1,
      a: P.B,
      b: P.C,
      gain: P[cfg.gain],
      pay: P[cfg.gain] === P.B ? P.C : P.B,
    },
    order: {
      open: 80,
      done: 200,
      fade: 216,
      cells: [
        [0, -8],
        [1, -8],
        [0, -7],
      ],
      winner: P.A,
      bonus: 6,
    },
    shout: { from: 190, to: 206, p: P.A, txt: 'йду в кільце' },
    ram: { t: 210, q: 7, r: 1, p: P.B },
    mercy: { t: 260, dur: 8, p: P[cfg.mercy] },
    crown: { form: 100, done: 130, p: P.C },
    annot: cfg.annot,
    chat: CHATS[n],
  };
}

'use strict';
/* Zaria / core :: terrain
   valley matrix as the server's response

   CORE. The world and its rules. This is the layer that will one day replace
   the real engine package: it does not depend on the display.

   Block 16. Before this wave, TWO non-overlapping places knew about the land, and both
   were mute: the cosmetic LAND in the display and the OBSTACLES list in the core. Now
   the cell type is a rule, and it lives here. The display and bots ASK, they don't compute it.

   The manifest format is written exactly as the server will deliver it: schema version, seed,
   a type dictionary and a sparse list of cells. Sparse - because plain terrain
   is the majority of the valley, and there's no point sending it. Then the switch to the real
   server changes the source, not the readers.

   Parts load IN ORDER from index.html and share one lexical
   scope: there are no modules on purpose - the demo must open with a double
   click from file://. The order in the markup must not be changed.
   ============================================================ */

/* manifest schema version: the server and client must agree on it before the match */
const TERRAIN_V = 1;

/* ===== type ledger =====
   The numbers are DRAFT and are edited via the terminal (\\\`land\\\` in \\\`help\\\`): this is a lab,
   not canon. The canon doesn't know about terrain types at all yet - zaria/04-mechanics
   lists cells as "empty, obstacle, relay, base", and the rules edit
   is waiting on a separate go-ahead from bart.

   pass  - whether the cell is passable for the shuttle
   build - whether a mast can be placed
   cost  - ticks per step (bog and hill cost more)
   min   - minutes per tick from a cell under coverage (income ledger, section 5
           of the coverage economy breakdown)
   hide  - shields the shuttle from enemy sight
   reach - a needle on this cell pulls the thread one step farther
   block - the thread does not pass through the cell */
const TERRAIN_TYPES = {
  bare: { uk: 'рівнина', pass: 1, build: 1, cost: 1, min: 2 },
  meadow: { uk: 'луг', pass: 1, build: 1, cost: 1, min: 3 },
  wood: { uk: 'гай', pass: 1, build: 1, cost: 1, min: 2, hide: 1 },
  sand: { uk: 'мілина', pass: 1, build: 1, cost: 1, min: 1 },
  marsh: { uk: 'драговина', pass: 1, build: 1, cost: 2, min: 1 },
  hill: { uk: 'пагорб', pass: 1, build: 1, cost: 2, min: 1, reach: 1 },
  water: { uk: 'вода', pass: 0, build: 0, cost: 0, min: 0 },
  mount: { uk: 'гора', pass: 0, build: 0, cost: 0, min: 0, block: 1 },

/* the dictionary order is part of the protocol: in the manifest the type travels as an index, not
   a string. Only append to the END, otherwise old manifests will be read
   with the wrong type */
const TERRAIN_ORDER = [
  'bare',
  'meadow',
  'wood',
  'sand',
  'marsh',
  'hill',
  'water',
  'mount',
];

/* parsed manifest: type per cell. Plain terrain is not stored in cells - it's the default.
   rev - the land's revision number. It increases on EVERY change of cells (manifest, foreign
   mountains) and is needed by whoever reads the land once and caches the result: the memo of adjacency
   between needles along the thread (linkRow) checks against exactly this value. Whoever edits cells bypassing these
   two gates must bump rev themselves - otherwise the memo will answer with the old land */
const TERRAIN = { v: TERRAIN_V, seed: 0, radius: RADIUS, rev: 0, cells: {} };
/* mountains as a separate list: read by the display and the old OBSTACLES name */
const TERRAIN_MOUNTS = [];

function terrainAt(q, r) {
  return TERRAIN.cells[hexKey(q, r)] || 'bare';
}
function terrainKindAt(k) {
  return TERRAIN.cells[k] || 'bare';
}
function terrainInfo(q, r) {
  return TERRAIN_TYPES[terrainAt(q, r)];
}
/* the Ukrainian name of the type - for the inspector and labels; the same word is the land
   refusal reason (terrainWhyName) */
function terrainName(q, r) {
  return terrainInfo(q, r).uk;
}
/* the same name, but by KIND rather than by cell: the construction event carries the land kind as a field,
   and the display assembles the line for it only after the mast is up (P71) */
function terrainTypeName(kind) {
  const info = TERRAIN_TYPES[kind];
  return info ? info.uk : kind;
}

/* ===== land tiers =====
   Height started out as a pure display layer, so vehicles passed straight through
   visible two-tier walls. Now the layout lives next to the land matrix:
   both the rules and the terraces read the same deterministic response */
const TERRAIN_H_KIND = {
  water: -0.55,
  marsh: -0.26,
  sand: -0.16,
  meadow: 0.04,
  wood: 0.2,
  hill: 0.85,
  mount: 1.6,
  bare: 0,
};
const TERRAIN_BANDS = 5;
const TERRAIN_DIRS = [
  [1, 0],
  [1, -1],
  [0, -1],
  [-1, 0],
  [-1, 1],
  [0, 1],
];
let TERRAIN_HGT = null; /* cell key -> normalized height 0..1 */

function terrainHeightDrop() {
  TERRAIN_HGT = null;
}
function terrainLattice(seed, n) {
  const rnd = mulberry32(seed);
  const a = new Float32Array(n * n);
  for (let i = 0; i < a.length; i++) a[i] = rnd();
  return a;
}
function terrainNoise(a, n, x, y) {
  const xi = Math.floor(x);
  const yi = Math.floor(y);
  const tx = x - xi;
  const ty = y - yi;
  const sx = tx * tx * (3 - 2 * tx);
  const sy = ty * ty * (3 - 2 * ty);
  const i0 = ((xi % n) + n) % n;
  const j0 = ((yi % n) + n) % n;
  const i1 = (i0 + 1) % n;
  const j1 = (j0 + 1) % n;
  return (
    (a[j0 * n + i0] * (1 - sx) + a[j0 * n + i1] * sx) * (1 - sy) +
    (a[j1 * n + i0] * (1 - sx) + a[j1 * n + i1] * sx) * sy
  );
}
/* the height grid - from the valley's DRAW (stage 0 of the 2026-09-12 shift). Before
   a single hardcoded seed served all valleys: the tier terrain was the same for every draw, one and the
   same, only the per-cell-type bonuses changed, and vertex C paid for it
   in matches - in the mirror of three equal vertices, 2 wins against 9 for B over 16 draws,
   with the grid tied to the draw: 8 against 7 (variant-mirror trial, 2026-09-12). The land
   must be a function of a single number in full, not just halfway */
function terrainHeights() {
  if (TERRAIN_HGT) return TERRAIN_HGT;
  const lat = terrainLattice(TERRAIN.seed, 64);
  const raw = {};
  for (let q = -RADIUS; q <= RADIUS; q++) {
    for (let r = -RADIUS; r <= RADIUS; r++) {
      if (hexDist(q, r, 0, 0) > RADIUS) continue;
      const w = hexToPixel(q, r);
      let h =
        terrainNoise(lat, 64, w.x * 0.055 + 11, w.y * 0.055 + 7) * 0.72 +
        terrainNoise(lat, 64, w.x * 0.135 + 3, w.y * 0.135 + 19) * 0.28;
      const d = Math.sqrt(w.x * w.x + w.y * w.y) / (RADIUS * SQRT3);
      h += d * d * 0.5;
      h += TERRAIN_H_KIND[terrainAt(q, r)] || 0;
      raw[hexKey(q, r)] = h;
    }
  }
  const out = {};
  let lo = 1e9;
  let hi = -1e9;
  Object.keys(raw).forEach(function (k) {
    const pair = k.split(',');
    const at = { q: +pair[0], r: +pair[1] };
    let sum = raw[k] * 2;
    let n = 2;
    TERRAIN_DIRS.forEach(function (d) {
      const v = raw[hexKey(at.q + d[0], at.r + d[1])];
      if (v === undefined) return;
      sum += v;
      n++;
    });
    const v = sum / n;
    out[k] = v;
    lo = Math.min(lo, v);
    hi = Math.max(hi, v);
  });

  Object.keys(out).forEach(function (k) {
    out[k] = (out[k] - lo) / span;
  });

  return out;
}
function terrainBand(h) {
  return h === undefined
    ? undefined
    : Math.min(TERRAIN_BANDS - 1, Math.floor(h * TERRAIN_BANDS));
}
function terrainLevel(q, r) {
  return terrainBand(terrainHeights()[hexKey(q, r)]);
}

/* ===== manifest: what arrives over the network ===== */
function terrainManifest() {
  const cells = [];
  Object.keys(TERRAIN.cells).forEach(function (k) {
    const qr = k.split(',');
    cells.push([+qr[0], +qr[1], TERRAIN_ORDER.indexOf(TERRAIN.cells[k])]);
  });
  /* the cell order is deterministic: the manifest for a given seed is byte-for-byte identical */
  cells.sort(function (a, b) {
    return a[1] - b[1] || a[0] - b[0];
  });
  return {
    v: TERRAIN.v,
    seed: TERRAIN.seed,
    radius: TERRAIN.radius,
    types: TERRAIN_ORDER.slice(),
    cells: cells,
  };
}
/* accept the manifest. Exactly what the participant's client will do at the start
   of a run: parse the response, check the version, lay it out by keys */
function terrainApply(m) {
  if (!m || m.v !== TERRAIN_V) return false;
  terrainHeightDrop();
  const dict = m.types || TERRAIN_ORDER;
  Object.keys(TERRAIN.cells).forEach(function (k) {
    delete TERRAIN.cells[k];
  });
  TERRAIN_MOUNTS.length = 0;
  TERRAIN.rev++;
  TERRAIN.seed = m.seed;
  TERRAIN.radius = m.radius || RADIUS;
  (m.cells || []).forEach(function (c) {
    const kind = dict[c[2]];
    if (!kind || kind === 'bare' || !TERRAIN_TYPES[kind]) return;
    TERRAIN.cells[hexKey(c[0], c[1])] = kind;
    if (kind === 'mount') TERRAIN_MOUNTS.push({ q: c[0], r: c[1] });
  });
  return true;
}
/* substituting mountains with another scenario's list: an imported valley has its own
   obstacles, and the land must follow them, not stay from the built-in one */
function terrainSetMounts(list) {
  terrainHeightDrop();
  Object.keys(TERRAIN.cells).forEach(function (k) {
    if (TERRAIN.cells[k] === 'mount') delete TERRAIN.cells[k];
  });
  TERRAIN_MOUNTS.length = 0;
  TERRAIN.rev++;
  (list || []).forEach(function (o) {
    TERRAIN.cells[hexKey(o.q, o.r)] = 'mount';
    TERRAIN_MOUNTS.push({ q: o.q, r: o.r });
  });
}

/* ===== line between cells =====
   The thread lies along the ground, not through the air: a mountain blocks it. We compute
   cubic interpolation with a half-step caveat - without it the line falls
   exactly on the border of two hexes, and a rounding coin-flip decides which one is on the path */
function hexLine(aq, ar, bq, br) {
  const n = hexDist(aq, ar, bq, br);
  const out = [];
  if (!n) return [{ q: aq, r: ar }];
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    out.push(hexRound(lerp(aq + 1e-6, bq + 1e-6, t), lerp(ar + 1e-6, br + 1e-6, t)));
  }
  return out;
}
/* whether the line is free of mountains: we don't count the endpoints - the needles themselves stand on them */
function terrainClear(aq, ar, bq, br) {
  const line = hexLine(aq, ar, bq, br);
  for (let i = 1; i < line.length - 1; i++) {
    if (TERRAIN_TYPES[terrainAt(line[i].q, line[i].r)].block) return false;
  }
  return true;
}

/* ===== coverage rings =====
   The needle takes all N from neighboring hexes (ring 1), 2/3 from the second row,
   1/3 from the third, nothing further. A breakdown with numbers and an efficiency table by step -
   notes/session-2026-08-15-coverage-economy.md, section 3 */
const COV_RINGS = [1, 1, 2 / 3, 1 / 3];
/* traversal of a hex and the three rings around it: 37 hexes. Called for every needle when
   recalculating coverage, so it runs as a loop over offsets rather than assembling arrays */
function hexAround(q, r, rad, fn) {
  for (let dq = -rad; dq <= rad; dq++) {
    const lo = Math.max(-rad, -dq - rad);
    const hi = Math.min(rad, -dq + rad);
    for (let ds = lo; ds <= hi; ds++) {
      const dr = -dq - ds;
      fn(q + dq, r + dr, Math.max(Math.abs(dq), Math.abs(dr), Math.abs(ds)));
    }
  }
}
/* the disk's edge - two outer rings (d = rad - 1 and rad): 12 * rad - 6 hexes
   instead of the whole disk with filtering inside the call. Mast sites are searched for
   only on the edge of the thread (botSites), and a full traversal paid for two-thirds of the hexes,
   which it immediately discarded (review 2026-09-12, item 5.3).

   The order of hexes is the SAME as in hexAround - by dq, within a row by ds: the list
   of sites sorts stably, and the order of ties in yield decides the battle.
   Within a row the edge is two segments at the ends (|ds| >= rad - 1 or
   |dq + ds| >= rad - 1); rows with |dq| >= rad - 1 lie entirely on the edge.
   Verified by brute-force comparison with hexAround at rad 0..9 (trial 2026-09-12) */
function hexRim(q, r, rad, fn) {
  const inner = rad - 1;
  for (let dq = -rad; dq <= rad; dq++) {
    const lo = Math.max(-rad, -dq - rad);
    const hi = Math.min(rad, -dq + rad);
    const whole = Math.abs(dq) >= inner;
    const lowEnd = whole ? hi : Math.min(hi, -inner + Math.max(0, -dq));
    const highStart = whole
      ? hi + 1
      : Math.max(lo, lowEnd + 1, inner - Math.max(0, dq));
    for (let ds = lo; ds <= lowEnd; ds++) {
      const dr = -dq - ds;
      fn(q + dq, r + dr, Math.max(Math.abs(dq), Math.abs(dr), Math.abs(ds)));
    }
    for (let ds = highStart; ds <= hi; ds++) {
      const dr = -dq - ds;
      fn(q + dq, r + dr, Math.max(Math.abs(dq), Math.abs(dr), Math.abs(ds)));
    }
  }
}

'use strict';
/* ZARIA / core :: terrain-even
   finishing of the laid-out terrain: write reserve, connectivity and EQUAL VERTICES

   CORE. The world and its rules. This is the layer that will one day replace
   the real engine package: it does not depend on presentation.

   Split out of zaria-terrain-gen.js when it hit the file's ceiling.
   Loads BEFORE it: the layout calls the finishing pass as its last line, and the
   layout itself already runs at load time.

   Parts load IN ORDER from index.html and share one lexical
   scope: there are intentionally no modules - the demo must open with a double
   click from file://. The order in the markup must not be changed.
   ============================================================ */
/* finishing of the laid-out terrain: reserve, connectivity, equal vertices. In three calls
   it cost the terminal function the last lines of its ceiling */
function terrainFinish(cells, full) {
  /* reserve: a ford instead of a river, a hill instead of a mountain */
  const keep = terrainReserved(full);
  Object.keys(keep).forEach(function (k) {
    if (cells[k] === 'water') cells[k] = 'sand';
    else if (cells[k] === 'mount') cells[k] = 'hill';
  });
  terrainUncut(cells, full); /* a mountain has no right to cut a valley */
  terrainEvenSeats(cells); /* the terrain is uneven, the starts are even */
}
/* ===== vertex alignment (bart's edit, 2026-08-17) =====
   The river and the ridges are laid down by their own draw and don't look at the vertices, so
   one base would get a swamp, and another a clean meadow: the measurement gave, at vertex C,
   forty-one cells of bog against eight at B, and zero wins out of eight in the mirror.

   Symmetry can't be made here - the map would become dead. It's not the shape being aligned,
   but the PRICE: for each base the cost of its own corner is calculated (how many ticks it costs
   to cross its cells, an impassable one counts as a penalty), and for the worst vertex the terrain is repaired
   one cell at a time - bog becomes plain, mountain becomes hill. The fix goes from the base
   outward, and only where the terrain is pricier than average; the valley beyond the corners is not
   touched at all */
const EVEN_R = 8; /* vertex's corner: the same range used to measure "at hand" */
function terrainSeatCost(cells, at) {
  let sum = 0;
  hexAround(at.q, at.r, EVEN_R, function (q, r) {
    if (hexDist(q, r, 0, 0) > RADIUS - 1) return;
    const kind = cells[hexKey(q, r)] || 'bare';
    const info = TERRAIN_TYPES[kind];
    sum += info.pass === false ? 3 : info.cost || 1;
  });
  return sum;
}
/* one repair: the expensive cell of its own corner nearest the base gets cheaper by one step */
function terrainEase(cells, at) {
  let best = null;
  let bd = 1e9;
  hexAround(at.q, at.r, EVEN_R, function (q, r, d) {
    if (hexDist(q, r, 0, 0) > RADIUS - 1) return;
    const k = hexKey(q, r);
    const kind = cells[k];
    if (kind !== 'marsh' && kind !== 'mount' && kind !== 'water') return;
    if (d < bd) {
      bd = d;
      best = k;
    }
  });
  if (!best) return false;
  const kind = cells[best];
  if (kind === 'mount') cells[best] = 'hill';
  else if (kind === 'water') cells[best] = 'sand';
  else delete cells[best];
  return true;
}
function terrainEvenSeats(cells) {
  const seats = PLAYERS.map(function (p) {
    return { at: SEAT_POS[p], cost: 0 };
  });
  for (let step = 0; step < 240; step++) {
    seats.forEach(function (s) {
      s.cost = terrainSeatCost(cells, s.at);
    });
    const order = seats.slice().sort(function (x, y) {
      return y.cost - x.cost;
    });
    const worst = order[0];
    const best = order[order.length - 1];
    /* two percent difference is the limit. Five turned out too soft: the scores in
       the mirror converged (168/176/160 vs 168/229/143 before the fix), but vertex
       C still took zero wins out of eight - the win goes to whoever is
       slightly higher, and a small skew shows in it more sharply than in the average score */
    if (worst.cost - best.cost <= best.cost * 0.02) return;
    if (!terrainEase(cells, worst.at)) return;
  }
}

'use strict';
/* Zaria / core :: terrain-gen
   valley layout from the draw: river with fords, groves, ridges, mountains, meadows

   CORE. The world and its rules. This is the layer that will one day replace
   the real engine package: it does not depend on the view.

   Block 16. The layout came from the view (formerly js/view/zaria-land.js) and
   grew three things, without which meaningful land doesn't live:

   1. RESERVE. The evening's recording is authored: event coordinates and shuttle frames
      are wired in by hand. Cells that the recording touches don't get
      impassable types - otherwise the demo would one day show a needle capture in the middle of a mountain.
      On the reserve the river becomes a SHOAL, and that's not a patch but a ford: routes
      of the recording assign the crossings themselves.
   2. CONNECTIVITY. Mountains have no right to cut the valley: canon requires connectivity
      and two non-intersecting routes between bases (04-mechanics:50,
      TZ-MAP-04/05). After the layout a check runs, and excess mountains are removed.
   3. INCOME GEOGRAPHY. Meadow is richer than plain, so it's placed NOT evenly:
      land is poor near the bases, rich near the Zaria and along the river. Staying home runs into
      an income ceiling, not a ban.

   Parts load IN ORDER from index.html and share one lexical
   scope: there are no modules on purpose - the demo must open with a double
   click from file://. The order in the markup must not be changed.
   ============================================================ */

/* riverbed in world coordinates: the view needs it for wave direction */
const LAND_RIVER = [];

/* ===== recording reserve =====
   The BATTLE land doesn't take this reserve, and that's not economy, but determinism: the reserve
   is computed from the current NEEDLES, while the battle's needles come from the draw themselves - a second run
   of the same draw would build the land on the ruins of the PREVIOUS battle and give a different
   game. Only the peaks and starting pairs are reserved for the battle: they are static */
function terrainReserved(full) {
  const keep = {};
  function mark(q, r, rad) {
    hexAround(q, r, rad === undefined ? 0 : rad, function (x, y) {
      keep[hexKey(x, y)] = 1;
    });
  }
  PLAYERS.forEach(function (p) {
    mark(SEAT_POS[p].q, SEAT_POS[p].r, 2);
    (SEAT_CHAIN[p] || []).forEach(function (k) {
      /* the key is parsed right here, not via keyToHex: that lives in the rules, and
         they load LATER than the land - in the browser these are separate scripts, and a call on
         load would fail. The smoke test doesn't catch this: it loads everything in one chunk,
         and the file order in it means nothing (caught by the driver) */
      const qr = String(k).split(',');
      mark(+qr[0], +qr[1], 1);
    });
  });
  if (!full) return keep;
  NEEDLES.forEach(function (n) {
    mark(n.q, n.r, 1);
  });
  FINDS.forEach(function (f) {
    mark(f.q, f.r, 1);
  });
  /* shuttle frames: the whole segment between frames is reserved, not just its ends.
     The shuttle moves in a straight line, and a mountain in the middle of the leg breaks the view just as much,
     as a mountain right under the needle */
  BASE_SHUTTLES.forEach(function (sh) {
    if (sh.orbit) {
      /* the Warden's shuttles travel in a circle: a hundred points around the circumference is enough,
         the step comes out smaller than a cell */
      for (let i = 0; i < 120; i++) {
        const a = (i * TRIG_N) / 120; /* angle in turn fractions; cosine from table */
        const h = pixelToHex(sh.orbit.r * trigCos(a), sh.orbit.r * trigSin(a));
        mark(h.q, h.r, 1);
      }
      return;
    }
    for (let i = 0; i < sh.kf.length - 1; i++) {
      hexLine(sh.kf[i][1], sh.kf[i][2], sh.kf[i + 1][1], sh.kf[i + 1][2]).forEach(
        function (h) {
          mark(h.q, h.r, 1);
        },
      );
    }
  });
  /* scripted routes of match 3: the second Weaver of peak C turns into a loop */
  Object.keys(GAME_CFG).forEach(function (n) {
    const kfo = GAME_CFG[n].kfo;
    if (!kfo) return;
    Object.keys(kfo).forEach(function (id) {
      const kf = kfo[id];
      for (let i = 0; i < kf.length - 1; i++) {
        hexLine(kf[i][1], kf[i][2], kf[i + 1][1], kf[i + 1][2]).forEach(function (h) {
          mark(h.q, h.r, 1);
        });
      }
    });
  });
  /* cells of the order and of the recording's captures */
  BASE_CAPS.forEach(function (c) {
    mark(c[2], c[3], 0);
  });
  /* inside the line the land is bare: that's where the Zaria's light is, and the reserve is needed there in full */
  for (let q = -CHERTA_R - 1; q <= CHERTA_R + 1; q++) {
    for (let r = -CHERTA_R - 1; r <= CHERTA_R + 1; r++) {
      if (hexDist(q, r, 0, 0) <= CHERTA_R + 1) keep[hexKey(q, r)] = 1;
    }
  }
  return keep;
}

/* ===== layout ===== */
/* ===== four streams of randomness instead of one (P53) =====
   The land section draws from its own stream, not the shared one. One stream for everyone
   made the layout hostage to call order: one extra rnd() in the groves would flip
   all the ridges, and the valley would change from an edit that had nothing to do with it.

   Seeds are derived - by simple multipliers from the shared one. The valley stays a function
   of one number: same seed - same land, and seed-hunting is cheap, because
   editing one section no longer moves the neighboring ones */
function terrainStreams(seed) {
  return {
    river: mulberry32(seed ^ 0x9e3779b9),
    wood: mulberry32(seed ^ 0x85ebca6b),
    ridge: mulberry32(seed ^ 0xc2b2ae35),
    land: mulberry32(seed ^ 0x27d4eb2f),
  };
}
/* ===== ridges: arcs of stone closer to the edge, with mountains along the crest =====
   A mountain isn't a scatter of lone cells but a wall two to four cells wide: a lone mountain
   gets walked around without a glance and means nothing, a wall forces a choice of side.
   The crest follows the same arc as the hills - a mountain always stands on a ridge, not
   in the middle of a meadow.

   With its own function - the generator has its own size ceiling, and ridges are the
   longest section in it. It places via the caller's putAt: drawing cells stays in one
   place, only the arc geometry moves out here.

   ANGLES ARE IN FRACTIONS OF A TURN (TRIG_N = 96), cosine from the trigCos/trigSin table
   (zaria-math.js), not Math.cos/sin: those don't guarantee matching low bits between
   engines, and a viewer in someone else's browser would build a different land (a wave
   of heads and the mandate on 2026-09-12, following hash1 of stage 0). The angle's draw is a whole
   table node; the old radian numbers have been converted into fractions of a turn (radian =
   15.28 fractions): arc span 0.45-0.95 rad = 6.9-14.5, crest wave 0.8 rad per
   step = 12.2, shift along the ridge 1 rad = 15.3 */
function terrainRidges(rs, putAt) {
  for (let i = 0; i < 4; i++) {
    const a = Math.floor(rs.ridge() * TRIG_N);
    const span = 6.9 + rs.ridge() * 7.6;
    const dd = RADIUS - 8 + rs.ridge() * 6;
    let wall = 0;
    for (let k = 0; k <= 34; k++) {
      const t = a + span * (k / 34 - 0.5) * 2;
      const rr = dd + trigSin(k * 12.2 + i * 15.3) * 1.1;
      putAt(trigCos(t) * rr * SQRT3, trigSin(t) * rr * SQRT3, 'hill', true);
      if (k % 3 === 0) {
        putAt(
          trigCos(t) * (rr + 1) * SQRT3,
          trigSin(t) * (rr + 1) * SQRT3,
          'hill',
          true,
        );
      }
      /* the wall starts by a roll and lasts two to four cells in a row */
      if (!wall && k > 2 && k < 31 && rs.ridge() < 0.16) {
        wall = 2 + Math.floor(rs.ridge() * 3);
      }
      if (wall) {
        putAt(trigCos(t) * rr * SQRT3, trigSin(t) * rr * SQRT3, 'mount', true);
        putAt(
          trigCos(t) * (rr + 0.85) * SQRT3,
          trigSin(t) * (rr + 0.85) * SQRT3,
          'mount',
          true,
        );
        wall--;
      }
    }
  }
}
function terrainGen(seed, full) {
  const rs = terrainStreams(seed);
  const rnd = rs.land;
  const cells = {};
  LAND_RIVER.length = 0;

  function put(q, r, kind, over) {
    const d = hexDist(q, r, 0, 0);
    if (d > RADIUS - 1) return;
    if (d < CHERTA_R + 1) return; /* right next to Zaria the ground is bare */
    const k = hexKey(q, r);
    if (cells[k] && !over) return;
    cells[k] = kind;
  }
  function putAt(x, y, kind, over) {
    const h = pixelToHex(x, y);
    put(h.q, h.r, kind, over);
  }

  /* ===== river: enters from one edge, goes around Zaria, exits on the other =====
     Angles in fractions of a turn, cosine by table (see terrainRidges): entry is a whole
     node, exit opposite with a spread of up to 0.35 rad (5 fractions), the bend is offset
     from the middle by 0.95 rad (14.5 fractions); riverbed wave 21 and 7.3 rad over the length -
     320.9 and 111.5 fractions, second channel 13.7 rad with a shift of 1.1 - 209.3 and 16.8 */
  const a0 = Math.floor(rs.river() * TRIG_N);
  const a1 = a0 + TRIG_N / 2 + Math.round((rs.river() - 0.5) * 10.7);
  const rim = (RADIUS - 1) * SQRT3;
  const p0x = trigCos(a0) * rim;
  const p0y = trigSin(a0) * rim;
  const p2x = trigCos(a1) * rim;
  const p2y = trigSin(a1) * rim;
  const am = (a0 + a1) / 2 + (rs.river() < 0.5 ? 1 : -1) * 14.5;
  const md = (CHERTA_R + 4 + rs.river() * 3) * SQRT3;
  const p1x = trigCos(am) * md;
  const p1y = trigSin(am) * md;
  const river = [];
  for (let i = 0; i <= 260; i++) {
    const t = i / 260;
    const u = 1 - t;
    let x = u * u * p0x + 2 * u * t * p1x + t * t * p2x;
    let y = u * u * p0y + 2 * u * t * p1y + t * t * p2y;
    const dx = 2 * u * (p1x - p0x) + 2 * t * (p2x - p1x);
    const dy = 2 * u * (p1y - p0y) + 2 * t * (p2y - p1y);
    const L = Math.sqrt(dx * dx + dy * dy) || 1;
    const w = trigSin(t * 320.9 + a0) * 0.9 + trigSin(t * 111.5) * 0.6;
    x += (-dy / L) * w;
    y += (dx / L) * w;
    river.push([x, y]);
    LAND_RIVER.push(x, y);
    putAt(x, y, 'water', true);
    if (trigSin(t * 209.3 + 16.8) > 0.55) {
      putAt(x + (-dy / L) * SQRT3, y + (dx / L) * SQRT3, 'water', true);
    }
  }
  /* backwater: overflow at the bend */
  const lake = river[Math.floor(river.length * (0.34 + rs.river() * 0.3))];
  const lh = pixelToHex(lake[0], lake[1]);
  hexAround(lh.q, lh.r, 3, function (q, r, d) {
    if (d <= 1.2 + rs.river() * 1.4) put(q, r, 'water', true);
  });

  /* ===== groves: patches, not uniform forest ===== */
  for (let i = 0; i < 8; i++) {
    const ang = Math.floor(rs.wood() * TRIG_N);
    const dist = CHERTA_R + 2 + rs.wood() * (RADIUS - CHERTA_R - 5);
    const c = pixelToHex(trigCos(ang) * dist * SQRT3, trigSin(ang) * dist * SQRT3);
    const rad = 1.3 + rs.wood() * 2.1;
    hexAround(c.q, c.r, 5, function (q, r, d) {
      if (d <= rad - 0.5 + rs.wood()) put(q, r, 'wood');
    });
  }

  terrainRidges(rs, putAt);

  /* ===== bog and shoal: wet ground and sand along the shore ===== */
  const NB = [
    [1, 0],
    [1, -1],
    [0, -1],
    [-1, 0],
    [-1, 1],
    [0, 1],
  ];
  const shore = [];
  Object.keys(cells).forEach(function (k) {
    if (cells[k] === 'water') shore.push(k);
  });
  shore.forEach(function (k) {
    const qr = k.split(',');
    const q = +qr[0];
    const r = +qr[1];
    NB.forEach(function (n) {
      const p = rnd();
      if (p < 0.3) put(q + n[0], r + n[1], 'marsh');
      else if (p < 0.44) put(q + n[0], r + n[1], 'sand');
    });
  });

  /* ===== meadow: income ledger, not a fill =====
     Patches are laid last and don't override water, grove, stone, and shore.
     Income geography: patch centers are drawn toward Zaria and the river, at bases the meadow does not
     exist at all - income at home hits a ceiling, and that's a reason to leave */
  for (let i = 0; i < 11; i++) {
    const ang = Math.floor(rnd() * TRIG_N);
    /* shift toward the middle: squaring the roll pushes patches toward the line */
    const far = rnd() * rnd();
    const dist = CHERTA_R + 1 + far * (RADIUS - CHERTA_R - 3);
    const c = pixelToHex(trigCos(ang) * dist * SQRT3, trigSin(ang) * dist * SQRT3);
    let poor = false;
    PLAYERS.forEach(function (p) {
      if (hexDist(c.q, c.r, SEAT_POS[p].q, SEAT_POS[p].r) < 7) poor = true;
    });
    if (poor) continue;
    const rad = 2.6 + rnd() * 3.6;
    hexAround(c.q, c.r, 9, function (q, r, d) {
      if (d <= rad && rnd() < 1 - (d / rad) * 0.75) put(q, r, 'meadow');
    });
  }
  /* floodplain: a strip of meadow along the river - water feeds the ground, and it's the richest
     land in the valley. It's also the reason to fight over the crossings */
  Object.keys(cells).forEach(function (k) {
    if (cells[k] !== 'sand' && cells[k] !== 'marsh') return;
    const qr = k.split(',');
    const q = +qr[0];
    const r = +qr[1];
    NB.forEach(function (n) {
      if (rnd() < 0.42) put(q + n[0], r + n[1], 'meadow');
    });
  });

  terrainFinish(cells, full);

  const out = [];
  Object.keys(cells).forEach(function (k) {
    const qr = k.split(',');
    out.push([+qr[0], +qr[1], TERRAIN_ORDER.indexOf(cells[k])]);
  });
  out.sort(function (a, b) {
    return a[1] - b[1] || a[0] - b[0];
  });
  return {
    v: TERRAIN_V,
    seed: seed,
    radius: RADIUS,
    types: TERRAIN_ORDER.slice(),
    cells: out,
  };
}

/* ===== connectivity check =====
   All needles and all hearths must lie in a single connected region of passable
   cells: the canon requires connectivity and two non-intersecting routes between
   bases (04-mechanics:50, TZ-MAP-04/05).

   The plan promised to "redo the roll if it cut through". It's done differently, and
   deliberately: reshuffling the whole valley over one unlucky wall gives variance
   and might not converge at all. Instead the blockage is PUNCHED THROUGH - the closest to
   the cut-off spot impassable cell on the edge of the connected region becomes
   passable: the mountain settles into a pass, the water shallows into a ford. The process is deterministic
   and always converges: each step removes exactly one impassable cell */
const TERR_NB = [
  [1, 0],
  [1, -1],
  [0, -1],
  [-1, 0],
  [-1, 1],
  [0, 1],
];
function terrainWalk(cells, from) {
  const seen = {};
  const queue = [from];
  seen[hexKey(from.q, from.r)] = 1;
  while (queue.length) {
    const cur = queue.pop();
    for (let i = 0; i < 6; i++) {
      const q = cur.q + TERR_NB[i][0];
      const r = cur.r + TERR_NB[i][1];
      const k = hexKey(q, r);
      if (seen[k]) continue;
      if (hexDist(q, r, 0, 0) > RADIUS - 1) continue;
      if (!TERRAIN_TYPES[cells[k] || 'bare'].pass) continue;
      seen[k] = 1;
      queue.push({ q: q, r: r });
    }
  }
  return seen;
}
/* how many cells were punched through - this number goes into the smoke test acceptance */
let TERRAIN_DUG = 0;
function terrainUncut(cells, full) {
  const want = [];
  if (full) {
    /* recording terrain: its needles are hardcoded by hand along with the event coordinates */
    NEEDLES.forEach(function (n) {
      want.push({ q: n.q, r: n.r });
    });
  }
  PLAYERS.forEach(function (p) {
    want.push(SEAT_POS[p]);
    if (full) return;
    /* battle terrain measures connectivity ONLY from statics - vertices and starting
       pairs. At this moment NEEDLES holds the needles of the PREVIOUS match (its own are placed later,
       onto this terrain - valleyMake), and measuring by them would mean building the terrain from
       the ruins of someone else's battle: roll 41 after 2026 and 7 produced a different battle than
       the first one (found by the parity gate on 2026-08-20). Its own needles settle
       only on passable ground (canPass in valleyPool and valleySpread).
       The key is parsed inline: keyToHex lives in the rules, which come later */
    (SEAT_CHAIN[p] || []).forEach(function (k) {
      const qr = String(k).split(',');
      want.push({ q: +qr[0], r: +qr[1] });
    });
  });
  TERRAIN_DUG = 0;
  for (let pass = 0; pass < 400; pass++) {
    const seen = terrainWalk(cells, want[0]);
    const lost = want.filter(function (w) {
      return !seen[hexKey(w.q, w.r)];
    });
    if (!lost.length) return true;
    /* edge of the connected region: impassable cells standing right next to what
       we've already reached. We punch through the one closer to the lost spot */
    let bk = null;
    let bd = 1e9;
    Object.keys(seen).forEach(function (k) {
      const qr = k.split(',');
      const q = +qr[0];
      const r = +qr[1];
      for (let i = 0; i < 6; i++) {
        const nq = q + TERR_NB[i][0];
        const nr = r + TERR_NB[i][1];
        if (hexDist(nq, nr, 0, 0) > RADIUS - 1) continue;
        const nk = hexKey(nq, nr);
        if (seen[nk] || TERRAIN_TYPES[cells[nk] || 'bare'].pass) continue;
        const d = hexDist(nq, nr, lost[0].q, lost[0].r);
        if (d < bd) {
          bd = d;
          bk = nk;
        }
      }
    });
    if (!bk) return false;
    cells[bk] = cells[bk] === 'water' ? 'sand' : 'hill';
    TERRAIN_DUG++;
  }
  return false;
}

/* ===== recording terrain and battle terrain (bart's edit, 2026-08-17) =====
   Before, this line was the entire geography of the demo: the terrain was built ONE time
   from a hardcoded number, and the battle roll never changed it at all. Hence the skew of the vertices,
   found by measurement: the game always ran on the same map, where vertex B had
   fourteen needles at hand and eight cells of bog, while C had nine needles and forty-one.

   Now the number is named: it's the evening's RECORDING roll, and it holds the valley for
   which the event coordinates are recorded. A live battle takes its terrain from its own roll
   (simInit), while returning to the recording puts this terrain back (liveStop) */
const LAND_SEED_REC = 20260814;
terrainApply(terrainGen(LAND_SEED_REC, true));

'use strict';
/* ZARIA / core :: valley-gen
   valley assembly from the draw, and swapping it for a scenario

   CORE. The world and its rules. This is the layer that will one day replace
   the real engine package: it does not depend on the display.

   Parts load IN ORDER from index.html and share a single lexical
   scope: there are no modules on purpose - the demo must open with a double
   click from file://. The order in the markup must not be changed.
   ============================================================ */
/* ===== valley from the draw (edit by bart, 2026-08-17) =====
   "I thought your map generation was competent and that you used seeds to balance
   the balance of land and artifacts". It wasn't competent: the land was assembled from one
   hardcoded number, the needles stood in a handwritten list, and the battle draw changed neither
   one nor the other. The cost of the skew was measured: in a mirror match of identical bots
   vertex B took eight wins out of eight (229 points against 168 and 143), because
   it had fourteen needles at hand, while C had nine and four times more swamp.

   The assembly works not by symmetry but by EQUALIZATION: the land stays uneven and varied,
   while the starting conditions of the three vertices are balanced by the count. Ruins are distributed by
   sectors (a sector is the hexes nearest to a given base), and the next plot is taken by whichever
   sector currently has the lower total income - by the end of the distribution both the number
   of needles and the income converge, while the locations differ for all three.

   The Keeper's Ring is assembled as a RING, not a star (bart's decision): its needles
   stand on the line the thread from the citadel cannot reach, and hold on to each
   other around the circle via spokes. Cutting one gives nothing - the cycle still holds from the
   other side; to sever an arc, you have to cut in two places.

   This does not concern the evening recording: it plays on built-in static data, for
   which event coordinates are recorded (BUILTIN_VALLEY below) */
const VALLEY_CFG = {
  ringR: CHERTA_R /* the ring stands on the line: the citadel's thread falls short */,
  ringN: 9 /* needles in the ring: a step of 4 hexes along the perimeter at a thread range of 5 */,
  spokeR: 3 /* spokes: through them the ring holds on to the citadel */,
  spokeN: 3 /* three spokes - three cuts, that is, the work of three */,
  belts: 3 /* range belts: all three get an equal share of near land and far */,
  gap: 2 /* minimum hexes between ruins: they shouldn't clump together */,
  near: 4 /* we don't place anything closer to base than this: the starting pair is already there */,
  far: 13 /* beyond this is no-man's backwater, where the swarm doesn't go */,
};
/* hexes of a hex-ring of radius R in angular order: the distribution around the circle must go
   around the circle, and the hexAround traversal gives the coordinate order */
function valleyRing(R) {
  const out = [];
  hexAround(0, 0, R, function (q, r, d) {
    if (d === R) out.push({ q: q, r: r });
  });
  out.sort(hexAngleCmp); /* round the circle on integers, no atan2 (shift stage 0) */
  return out;
}
/* N points evenly around the ring; an impassable hex yields to the nearest neighboring
   hex on the same ring - otherwise a needle would land on a mountain and be neither gatherable nor takeable */
function valleySpread(R, n, seed) {
  const ring = valleyRing(R);
  const out = [];
  if (!ring.length) return out;
  const shift = Math.floor(hash1(seed * 37 + R * 1009) * ring.length);
  for (let i = 0; i < n; i++) {
    const at = Math.round((ring.length * i) / n + shift);
    let cell = null;
    for (let step = 0; step < ring.length && !cell; step++) {
      const side = step % 2 ? -Math.ceil(step / 2) : Math.ceil(step / 2);
      const c = ring[(((at + side) % ring.length) + ring.length) % ring.length];
      const taken = out.some(function (o) {
        return o.q === c.q && o.r === c.r;
      });
      if (!taken && canPass(c.q, c.r)) cell = c;
    }
    if (cell) out.push(cell);
  }
  return out;
}
/* whose corner of the valley this is: the sector is determined by the nearest base, not by degrees -
   that way it actually means what's needed ("whoever has it at hand") */
function valleySeat(q, r, seats) {
  let best = null;
  let bd = 1e9;
  seats.forEach(function (s) {
    const d = hexDist(q, r, s.at.q, s.at.r);
    if (d < bd) {
      bd = d;
      best = s;
    }
  });
  return { seat: best, dist: bd };
}
/* the ROAD to a spot, not the distance: swamp costs double, a mountain is routed around. We count
   along a straight line - the exact path is found by A*, but it's not needed here: what matters to us is the order
   of the spots, not minute-for-minute precision. The first equalization measurement showed exactly this: the income
   of the sectors converged, yet vertex C still took zero wins out of eight, because
   the same needles cost it more in movement (swamp 22 hexes against 17) */
function valleyRoad(base, q, r) {
  const line = hexLine(base.q, base.r, q, r);
  let sum = 0;
  for (let i = 1; i < line.length; i++) {
    const a = line[i - 1];
    const h = line[i];
    sum += canPass(h.q, h.r)
      ? stepCost(a.q, a.r, h.q, h.r, null)
      : SIM_CFG.stepKlinok * 3;
  }
  return sum || SIM_CFG.stepKlinok;
}
/* the belt of a spot: distribution proceeds belt by belt, so all three get an equal share of both near
   land and far. Without belts, a sector with a poor periphery would fill its quota
   near the base, while a sector with a rich one would fill it far away, and the starting conditions would diverge
   a second time, now by the road */
function valleyBelt(road) {
  const step = (VALLEY_CFG.far - VALLEY_CFG.near) / VALLEY_CFG.belts;
  const b = Math.floor((road / SIM_CFG.stepKlinok - VALLEY_CFG.near) / step);
  return Math.max(0, Math.min(VALLEY_CFG.belts - 1, b));
}
/* candidates for ruins: passable hexes of their own sector, not right at the base and not in the
   backwater. The score is a spot's income divided by the road to it, with a draw: this way
   identical lands don't produce identical valleys */
function valleyPool(seed, seats, used) {
  const pool = [];
  hexAround(0, 0, RADIUS - 1, function (q, r, d) {
    if (d <= VALLEY_CFG.ringR + 1 || !canPass(q, r) || used[hexKey(q, r)]) return;
    const own = valleySeat(q, r, seats);
    if (own.dist < VALLEY_CFG.near || own.dist > VALLEY_CFG.far) return;
    const rate = econNeedleRate({ q: q, r: r }, false);
    const road = valleyRoad(own.seat.at, q, r);
    const worth = rate / (1 + road / 10);
    pool.push({
      q: q,

   the manifest before the run. Just like finds: the canon calls them "terrain, not
   a lottery", and lots are built the same way for the same reason. A dynamic
   lot, one the world places wherever it's hot right now, would turn the auction into
   a reaction to the leader, and we're testing the trade-off.

   On tick lot.at the auction opens: bids sealed in energy,
   the winner pays the runner-up's price (Vickrey), the lot's needles pass to them WITHOUT
   warm-up. The resolution itself doesn't live here - here there's only the layout and
   the index; phase 2 of the tick will come as a separate pass.

   ===== SCHEDULE: WHAT EXACTLY WAS CHANGED AGAINST THE CANON =====
   Canon 15.1 gives AUCTION_SCHEDULE_TRIO = [45, 105, 165, 225, 285]. These are
   FRACTIONS of the match, not absolute ticks: at the recorded 360 they give
   0.125, 0.2917, 0.4583, 0.625, 0.7917.

   The first four fractions are taken as is. ONE was changed, the last one: 0.7917 ->
   0.75. The reason is mechanical, not a matter of taste. The auction must land there,
   where energy has an alternative: it can be spent on a bid OR on a hull
   (Blade 50, Weaver 90, needle 60), and that's the whole trade-off. Near the end of the match
   it's too late to build and no point saving up, there's no alternative, and the auction degenerates
   into dumping the leftover - whoever has hoarded more wins, meaning once again
   the leader. On a 1200-tick match the 0.7917 fraction puts the last auction at
   tick 950, fifty ticks before dawn; the 0.75 fraction puts it at 900.

   the share of the last auction's bids relative to reserves, against that same share on the earlier ones.
   A skew means the tick sits too late, and it gets moved left. */
const AUCTION_CFG = {
  /* fractions of the match at which lots open (AUCTION_SCHEDULE_TRIO) */
  schedule: [0.125, 0.29167, 0.45833, 0.625, 0.75],
  /* ruins per lot: a fifth of the free ruins of the
     valley pass through auction, not half. The mechanic must be noticeable and doesn't have to be
     the main one (AUCTION_LOT_CELLS) */
  cells: 2,
  /* within what range ruins count as adjacent: the step between ruins along

  span: 4,

   all five auctions sit before it, but on the 360 test bench dawn is at 160 and three
   of the five auctions fall past it. After dawn there's no Warden, the ring pulls twice as hard,
   it's too late to build - energy has no alternative left, and the auction degenerates

   Candidate - an unclaimed ruin outside the boundary: starting chains and the Warden's network (the ring and

/* spread of lots across vertices: how many hexes of lots landed in the vicinity of each.
   You can buy a needle without moving from the spot, but you have to HOLD what's bought, and a needle torn
   from the network lives degraded. So a lot's location matters to the vertex, and
   it is measured by the same radius as ruin value. */
function valleyLotSpread(lots) {
  const V = PLAYERS.map(function (p) {
    const k = (SEAT_CHAIN[p] || [])[0];

      l.cells.forEach(function (c) {

function lotPack(order, head, used) {
  const pack = [head];

    .filter(function (n) {

        n !== head &&

        hexDist(n.q, n.r, head.q, head.r) <= AUCTION_CFG.span
      );
    })
    .sort(function (x, y) {
      return hexDist(x.q, x.r, head.q, head.r) - hexDist(y.q, y.r, head.q, head.r);
    });

    .map(function (n, i) {

    .sort(function (x, y) {
      return x.w - y.w || x.i - y.i;

    .map(function (x) {

    const at = auctionAt(AUCTION_CFG.schedule[s], ticks);
    if (!auctionFits(at, ticks)) continue;
    let cells = null;

      if (used[hexKey(order[i].q, order[i].r)]) continue;
      cells = lotPack(order, order[i], used);

    cells.forEach(function (n) {

   decides, not quantity */
function valleyLots(needles, seed, ticks) {
  if (!SIM_CFG.lotsOn) return []; /* A/B toggle: valley without trading */
  const cand = needles.filter(valleyLotFits);
  let best = null;
  for (let turn = 0; turn < LOT_RESAMPLE_TRIES; turn++) {
    const lots = valleyLotsTry(cand, seed, ticks, turn);
    const spread = valleyLotSpread(lots);

   a needle takes all N from neighboring cells (ring 1), 2/3 from the second row,
   1/3 from the third, nothing further; two needles on the same cell together pull no

/* pull per player per cell, area under connection, and income per tick */
const ECON = {

     division rule, otherwise holdings at the center mean nothing */
  pull: { A: {}, B: {}, C: {}, K: {} } /* cell key -> player pull 0..1 */,
  area: { A: 0, B: 0, C: 0, K: 0 } /* cells under connection */,
  rate: { A: 0, B: 0, C: 0, K: 0 } /* minutes per tick */,
  /* jamming loot: pull from jammed enemy needles (cell key -> weight) and its
     share in tick minutes - the ledger's reference field stolen (stage 2) */
  loot: { A: {}, B: {}, C: {}, K: {} },
  /* pull of one's own network without loot - the head gauge (econNetAt); while there is no loot,
     it is the same table as pull */

  stolen: { A: 0, B: 0, C: 0, K: 0 },
  sig: '' /* layout signature: recompute only on change */,

/* network signature: who owns what, what is burning and what is being fed. Coverage
   is recalculated ONLY when it changes - over a thousand ticks that's a hundred and
   fifty times instead of a thousand, and walking three rings for each needle is not cheap */
function econSig(world) {
  const parts = [];
  ACTORS.forEach(function (p) {
    const lit = world.lit[p] || {};
    /* weight, not just a key: a needle burning down changes income without changing the composition
       of the set, and a signature without weight would hold a stale ledger */
    parts.push(
      p +
        ':' +
        Object.keys(lit)
          .sort()
          .map(function (k) {
            return k + '=' + lit[k];
          })
          .join('|'),

  });
  parts.push(
    'f:' +
      Object.keys(world.fed || {})
        .sort()
        .join('|'),
  );

     is alive, and its duration is part of the layout (stage 2 of the 2026-09-12 shift). The owner
     of the jammed needle - too: loot flows while the needle is not one's own (econLoot), and
     capturing a jammed dark needle did not change a single burning list -
     the cache held the loot until the next layout change, while the SDK mirror,
     whose signature is driven by belief rather than truth, diverged from the process (wire
     v7, gate pack: seed 41, tick 750) */
  const jam = [];
  Object.keys(world.jam || {}).forEach(function (k) {
    const j = world.jam[k];
    if (j.until > world.t) jam.push(k + ':' + j.p + ':' + (world.own[k] || ''));

  return dawn ? SIM_CFG.dawnRing : SIM_CFG.ringPull;

/* ===== coverage of a single needle: which cells and with what weight =====
   Ring geometry does not change during a battle - only which needle is burning changes.
   And walking three rings for EVERY burning needle is the most expensive tick in the world: at
   layout recompute that is up to eighteen thousand cells and up to eleven
   milliseconds at once (measured 2026-08-17, tail of ticks). The cache lives on the
   needle itself - like the income cache botRate - and dies together with it.
   The order of cells in the cache is the same as hexAround walked them: by it

    if (hexDist(q, r, 0, 0) > RADIUS - 1) return;

   the ledger only cuts the overdraw, meaning the excess pull simply disappears. With
   the knob above zero, two of one's own spots share one spectrum and interfere with each other, and
   a dense network pays for its density.

   The function is deliberately the same for the world and for bot scoring: a world knob without the same
   term in the bot's metric is void - it keeps placing needles in the same spots, and the measurement
   shows only that the world got poorer (verified 2026-08-19: the network did not
   change by a single needle at any stage) */

     that is, almost double for one bot standing still */
  ACTORS.forEach(function (p) {

    const pull = ECON.pull[p];
    const lit = world.lit[p] || {};
    for (let i = 0; i < keys.length; i++) {

      const mult = (n.ring ? ringPull(world.dawn) : 1) * (lit[k] || 0);

  if (!w) return 'no world';
  let bad = null;
  PLAYERS.forEach(function (p) {
    if (w.chan[p] < 0) bad = 'channel below zero: ' + p;
    if (w.chan[p] > w.chanAt[p] + 0.001) bad = 'channel above the tick budget: ' + p;
    if (w.ear[p] < 0) bad = 'ears below zero: ' + p;
    if (w.ear[p] > w.earAt[p] + 0.001) bad = 'ears above the tick budget: ' + p;
    if (w.energy[p] < 0) bad = 'charge below zero: ' + p;
    if (w.needles[p] < 0) bad = 'needle count below zero: ' + p;
    if (squadWeight(p) > SIM_CFG.squadWeight) bad = 'swarm heavier than its cap: ' + p;
  });
  let owned = 0;
  Object.keys(w.own).forEach(function (k) {
    owned++;
    if (!NEEDLE_BY_KEY[k]) bad = 'needle not on ruins: ' + k;
  });
  if (owned > NEEDLES.length) bad = 'more needles than masts in the valley';
  Object.keys(w.fed).forEach(function (k) {
    if (w.own[k] !== w.fed[k]) bad = 'a foreign or unowned needle is fed: ' + k;
  });
  SIM.units.forEach(function (u) {
    if (!canPass(u.q, u.r)) bad = 'shuttle on an impassable cell: ' + u.id;
    if (u.kf.length > SIM.kfKeep) bad = 'shuttle keyframes grow without bound: ' + u.id;
    if (u.motion && u.motion.length > SIM.kfKeep) {
      bad = 'shuttle motion grows without bound: ' + u.id;
    }
  });
  return bad;
}

'use strict';
/* Zaria / core :: sim-act
   what the shuttle does: step, warmup, shutdown, construction, feeding, tether

   CORE. The world and its rules. This is the layer that will someday replace
   the real engine package: it doesn't depend on the view.

   One general law for the whole file (section 10 of the economy breakdown): WORK COSTS
   STILLNESS. Construction, feeding, and warmup immobilize the machine, so
   a fast Blade is vulnerable exactly at the moment it does its job. Without this
   law, a light class can't be killed by anything but ramming.

   Parts load IN ORDER from index.html and share one lexical
   scope: there are intentionally no modules - the demo must open with a double
   click from file://. The order in the markup must not change.
   ============================================================ */

/* ===== masts placed in battle =====
   The valley's ruins are static, but bots place new needles themselves - without this
   the coverage economy isn't tested at all: the distance between needles matters
   only when the player chooses where to place them. What's built lives
   in the same NEEDLES as the ruins: the view, the score, and the thread see no difference */
function simAddNeedle(q, r, p) {
  const w = SIM.world;
  const key = hexKey(q, r);
  if (NEEDLE_BY_KEY[key]) return null;
  const n = { q: q, r: r, key: key, built: true };
  NEEDLES.push(n);
  NEEDLE_BY_KEY[key] = n;
  linkAdd(n); /* the thread's neighbor tracker knows the new mast this tick */
  sightAdd(n); /* and the sight tracker: neighbors see it from the same tick */
  w.own[key] = p;
  w.capAt[key] = SIM.t;
  w.needles[p]++;
  embReset(key);
  return n;
}
/* the SDK mirror lives through the action phase before the authoritative frame arrives. If
   its shortened copy of the path finished the construction countdown before the server did, such a mast
   must disappear entirely, not remain as an invisible ruin in the index. This
   is a targeted rollback only of a BUILT needle; valley ruins can't be removed. */
function simDropBuiltNeedle(key, deferCaches) {
  const n = NEEDLE_BY_KEY[key];
  if (!n || !n.built) return false;
  const at = NEEDLES.indexOf(n);
  if (at < 0) return false;
  delete NEEDLE_BY_KEY[key];
  NEEDLES.splice(at, 1);
  if (!deferCaches) {
    linkDrop();
    sightDrop();
  }
  return true;
}
/* cleanup before a new battle: what was placed in the previous round has no right
   to leak into the evening's recording - otherwise ghost ruins would show up on the valley */
function simClearBuilt() {
  for (let i = NEEDLES.length - 1; i >= 0; i--) {
    if (!NEEDLES[i].built) continue;
    simDropBuiltNeedle(NEEDLES[i].key, true);
  }
  linkDrop(); /* the neighbor tracker was built for the previous valley, and it's already a different one */
  sightDrop();
}

/* the machine is eliminated. Cleanup removes it from the field at the end of the tick, not this function:
   cutting it out of the array being iterated over is a sure way to skip
   the neighboring machine */
function simLose(u, why) {
  if (u.dead) return;
  u.dead = true;
  u.until = SIM.t;
  /* the reason is named in words, not thrown away: ramming gave the machine a second
     way to be eliminated, and a feed where everyone dies "out of contact" would be lying */
  simEvent({
    type: 'lost',
    p: u.p,
    q: u.q,
    r: u.r,
    cls: u.cls,
    why: why || "зв'язок",
    key: 'ev.lost',
  });
}

/* ===== tether: bots live inside the comms zone =====
   bart's idea, the strongest in the batch: a cut stops being "minus a few
   points per minute" and becomes "the neighbor just lost half their army".
   Leave the zone and you live off your own reserve of AUTONOMY ticks. Once it runs out: the light one
   goes on autopilot to its nearest own comms, the heavy one freezes */
function simLeash(u) {
  const w = SIM.world;
  if (inZone(u, w)) {
    u.away = 0;
    u.stuck = false;
    return;
  }
  u.away = (u.away || 0) + 1;
  if (u.away <= SIM_CFG.autonomy) return;
  if (u.cls === 'ткач') {
    /* the heavy one freezes: a station on wheels doesn't drive without comms. But it doesn't freeze
       forever - otherwise an abandoned machine would carry the swarm's weight for the rest of the match, and
       a player pays for one mistake by playing the rest of the match at a quarter strength. Stood idle four times longer
       than its reserve - it dies out completely, and that's the clearest consequence of a severed line
       that can be shown to a viewer at all */
    u.stuck = true;
    u.work = 0;
    if (u.away > SIM_CFG.autonomy * 4) simLose(u, "зв'язок");
    return;
  }
  u.stuck = false;
  /* home spares the leash only on a path that ends in the zone (rule 10.9, zaria-econ.js) */
  if (u.task && u.task.home && homeInZone(u, w)) return;
  /* the turn-around waits for the hex. The machine doesn't step instantly, and interrupting the path mid-
     step means carrying accumulated ticks over into the new direction - and on screen it
     jerks backward as a result. Autopilot will wait one to three ticks */
  if (u.wait) return;
  const to = nearestZone(u, w);
  if (!to) return;
  const path = botPath({ q: u.q, r: u.r }, to, 900, u);
  if (!path) return;
  /* autopilot is paid for with charge, not minutes: minutes are points, and you
     can't pay with those, or the game's score stops being a score */
  w.energy[u.p] = Math.max(0, w.energy[u.p] - 1);
  u.task = { goal: null, path: path, jam: null, home: true };
}

/* ===== step =====
   One hex per stepCost ticks: ground costs moveCost, a climb costs one more tick
   of liftoff. The frame gets appended to kf, so the view draws the live battle with the same
   code as the recording, and rewinding backward works within the buffer */
function simStep(u) {
  if (u.stuck) return;
  if (u.work) return; /* work costs stillness */
  if (u.from === SIM.t) return; /* just lifted off: the path starts next tick */
  if (!u.task || !u.task.path || !u.task.path.length) return;
  const next = u.task.path[0];
  /* wait is ticks already spent on the road INTO THIS hex, and nowhere else.
     A recall home interrupts the path right in the middle of a step, and without this marker the machine
     would carry the accumulated progress into the new direction: it would arrive ahead of schedule, and the view
     would jerk it half a hex backward (found by a jitter measurement, 2026-08-16) */
  const step = hexKey(next.q, next.r);
  if (u.stepKey !== step) {
    u.stepKey = step;
    u.wait = 0;
  }
  u.wait = (u.wait || 0) + 1;
  if (u.wait < stepCost(u.q, u.r, next.q, next.r, u)) return;
  /* BODY BLOCK (cut C2): a hex occupied by another's body is impassable. A step not
     spent - the machine waits for the hex to free up, but not forever: after
     blockGiveUp ticks the path is abandoned, otherwise two machines meeting head-on would stand there till the end */
  if (hexTaken(next.q, next.r, u)) {
    u.wait = stepCost(u.q, u.r, next.q, next.r, u) - 1; /* ready when it frees */
    u.block = (u.block || 0) + 1;
    if (u.block >= SIM_CFG.blockGiveUp) {
      u.block = 0;
      u.task = null;
      u.stepKey = null;
      u.wait = 0;
    }
    return;
  }
  u.block = 0;
  u.wait = 0;
  u.task.path.shift();
  if (!canStep(u.q, u.r, next.q, next.r)) {
    u.task = null;
    return;
  }
  u.q = next.q;
  u.r = next.r;
  findArrive(u, SIM.world); /* cut C3: take underfoot, turn round the neighbor */
  u.kf.push([SIM.t, u.q, u.r]);
  if (u.kf.length > SIM.kfKeep) u.kf.shift();
  if (!u.task.path.length && u.task.home) u.task = null;
}

/* ===== actual track of the live display =====
   wait stores the number of paid ticks of the move, but doesn't say WHICH ticks they
   happened in. If there weren't enough hands for the machine, the previous interpolation subtracted from
   wait the elapsed time and drew a rollback backward. So the live display gets
   a short series of already-happened positions: one sample per tick, the same limit
   as hex frames. The match recording still stores only [t,q,r]. */
function simMotion(u) {
  let aq = u.q;
  let ar = u.r;
  let bq = aq;
  let br = ar;
  let k = 0;
  let phase = 0;
  const next = u.task && u.task.path && u.task.path[0];
  if (next && u.wait) {
    bq = next.q;
    br = next.r;
    const dur = stepCost(aq, ar, bq, br, u);
    k = stepTravel(aq, ar, bq, br, u, u.wait);
    phase = clamp(u.wait / dur, 0, 1);
  }
  const a = hexToPixel(aq, ar);
  const b = hexToPixel(bq, br);
  const row = [SIM.t, lerp(a.x, b.x, k), lerp(a.y, b.y, k), aq, ar, bq, br, k, phase];
  if (!u.motion) u.motion = [];
  if (u.motion.length && u.motion[u.motion.length - 1][0] === SIM.t) u.motion.pop();
  u.motion.push(row);
  if (u.motion.length > SIM.kfKeep) u.motion.shift();
}
function simActMotion(u) {
  if (u.dead) return;
  simActs(u);
  simMotion(u);
}

/* ===== shipyard: release of finished hulls =====
   The exit point is the hearth; an occupied hearth shifts the hull to the first free
   neighboring hex in traversal order. Too tight - the hull waits: it's already paid for */
function simYard(w) {
  ACTORS.forEach(function (p) {
    const q = w.yard[p];
    if (!q || !q.length) return;
    const base = BASES && BASES[p];
    if (!base) return;
    for (let i = 0; i < q.length;) {
      if (q[i].at > SIM.t) {
        i++;
        continue;
      }
      const spot = yardSpot(base.q, base.r);
      if (!spot) break; /* too tight: wait for the next tick */
      const cls = q[i].cls;
      q.splice(i, 1);
      simHull(p, cls, spot.q, spot.r);
    }
  });
}
/* a free hex for the hull: first the hearth itself, then the neighbors going around */
function yardSpot(bq, br) {
  if (!hexTaken(bq, br, null)) return { q: bq, r: br };
  let out = null;
  hexAround(bq, br, 1, function (q, r, d) {
    if (out || !d) return;
    if (!canStep(bq, br, q, r) || hexTaken(q, r, null)) return;
    out = { q: q, r: r };
  });
  return out;
}
/* whether the hex is occupied by someone else's hull. Without body-block it's never occupied */
function hexTaken(q, r, self) {
  if (!SIM_CFG.bodyBlock) return false;
  for (let i = 0; i < SIM.units.length; i++) {
    const u = SIM.units[i];
    if (u.dead || u === self) continue;
    if (u.q === q && u.r === r) return true;
  }
  return false;
}

/* ===== work in place: building the mast and feeding the needle =====
   Both are a privilege of the heavy Weaver (bart's verdict on classes) and both cost
   immobility. Feeding shifts the coverage profile by a ring: it was 21
   units of income, now it's 39 - almost double for one bot standing still */
function simBuild(u, w) {
  const why = buildWhy(u.q, u.r, w);
  if (why) {
    u.task = null;
    u.work = 0;
    simDeny(u.p, terrainWhyName(why), u.q, u.r);
    return;
  }
  /* not enough charge - the machine STANDS and waits, rather than abandoning the site. This is
     the budget: the swarm saves up for the mast, and the frame shows that the heavy one frozen in place isn't
     just for show. You can't wait forever - three build periods, and it leaves to go about its
     business */
  if (w.energy[u.p] < SIM_CFG.costNeedle) {
    u.wait = (u.wait || 0) + 1;
    if (u.wait > SIM_CFG.buildTicks * 3) {
      u.task = null;
      u.wait = 0;
    }
    return;
  }
  u.work = (u.work || 0) + 1;
  if (u.work < SIM_CFG.buildTicks) return;
  u.work = 0;
  u.task = null;
  w.energy[u.p] -= SIM_CFG.costNeedle;
  if (!simAddNeedle(u.q, u.r, u.p)) return;
  simEvent({
    type: 'raise',
    p: u.p,
    q: u.q,
    r: u.r,
    land: terrainAt(u.q, u.r) /* type of terrain: the display gives it its name */,
    key: 'ev.raise',
  });
}
function simWork(u) {
  const w = SIM.world;
  if (u.cls !== 'ткач' || u.stuck) return;
  const key = hexKey(u.q, u.r);
  /* building: reached the site - stands and builds */
  if (u.task && u.task.site === key) {
    simBuild(u, w);
    return;
  }
  u.work = 0;
  /* feeding: only by the feed order on THIS needle (rules 8.5, 13.6a; without a task it fed
     for free - no command, no hands). While the Weaver stands at it, the profile is shifted by a
     ring; left or died - the bonus fades on its own, the list of those fed is rebuilt every tick */
  if (!u.task || u.task.feed !== key) return;
  if (u.task.path && u.task.path.length) return;
  if (w.own[key] === u.p && (w.lit[u.p] || {})[key]) w.fed[key] = u.p;
}

/* ===== ram: hull on hull, and both fall =====
   Canon (04-mechanics, phase 6): the order is available only to the Blade, the target is a living
   shuttle in a NEIGHBORING hex, resolution is simultaneous - all executors die and
   all their targets. The rule intentionally has no numeric constants.

   In the demo, the ram is the only way to answer machine with machine. Without it, neither
   intercepting a bot, nor the Warden's response would have anything to end with: jamming removes
   income, but doesn't remove the one who came */
function simRam(u) {
  if (u.dead || u.mute || u.cls !== 'клинок') return null;
  const id = u.task && u.task.ram;
  if (!id) return null;
  const seen = obsFoe(u.p, id);
  if (!seen) {
    /* Contact lost: the old route can be finished, but the pursuit
       no longer gets coordinates from the world. We don't cut off a step that's already paid for. */
    u.task.ram = null;
    return null;
  }
  const tgt = simUnit(id);
  if (!tgt || tgt.dead || pactWith(SIM.world, u.p, tgt.p)) {
    u.task = null; /* no target, or it's a pact partner (stage 6) */
    return null;
  }
  /* the line limits the Warden: a guest seen beyond it is not a target
     (canon TZ-KPR-3; stage 1 of the shift, 2026-09-12) */
  if (
    u.p === KEEPER &&
    KEEPER_CFG.chaseCherta &&
    hexDist(seen.q, seen.r, 0, 0) > CHERTA_R
  ) {
    u.task = null;
    return null;
  }
  if (hexDist(u.q, u.r, tgt.q, tgt.r) > 1) {
    simChase(u, seen);
    return null;
  }
  /* a clean ram: a Weaver working in place is defenseless (warming up or building),
     and the rammer survives. Warming up is recognized by its contribution to w.heat on its own hex -
     the same sign the world itself uses to count it as warming up */
  const w = SIM.world;
  const at = w.heat[hexKey(tgt.q, tgt.r)];
  const busy = (tgt.work || 0) > 0 || !!(at && at[tgt.p]);
  return { u: u, tgt: tgt, clean: !!SIM_CFG.ramClean && busy };
}
/* First all legal collisions are collected, then the machines are removed.
   Otherwise A -> B -> C leaves C alive: the dead B doesn't manage to execute
   its already-legal ram. The order machines were created in doesn't decide the outcome of the trade. */
function simRams() {
  const hits = [];
  SIM.units.forEach(function (u) {
    const hit = simRam(u);
    if (hit) hits.push(hit);
  });
  hits.forEach(function (hit) {
    simEvent({
      type: 'ram',
      p: hit.u.p,
      q: hit.tgt.q,
      r: hit.tgt.r,
      tgt: hit.tgt.p,
      key: 'ev.ram',
    });
    simLose(hit.tgt, 'таран');
    if (!hit.clean) simLose(hit.u, 'таран');
  });
}
/* pursuit: the target moves, so the path ages. We recompute it only when it
   has ended, or when the target has left its end - A* across the valley isn't cheap, and running
   it every tick for every pursuer means paying with frame time */
function simChase(u, tgt) {
  if (u.wait) return; /* the step runs to the hex (see the jerky-movement fix) */
  const path = u.task.path;
  const last = path && path.length ? path[path.length - 1] : null;
  if (last && hexDist(last.q, last.r, tgt.q, tgt.r) <= 1) return;
  /* BODY-BLOCK (slice C2): you can't chase ONTO the target's hex - it's occupied by the target itself.
     The ram hits the neighboring hex, so that's what we aim for. Pathfinding remains pure
     geometry: the participant's oracle computes the same routes */
  const aim = SIM_CFG.bodyBlock ? chaseSpot(u, tgt) : { q: tgt.q, r: tgt.r };
  if (!aim) return;
  const p = botPath({ q: u.q, r: u.r }, aim, 400, u);
  if (p) u.task.path = p;
}
/* the hex next to the target, closest to the pursuer.
   OCCUPANCY IS DELIBERATELY NOT CHECKED HERE: the pursuit runs on a snapshot of belief, and
   hulls on neighboring hexes are a truth the bot doesn't see (the gate
   ram-visibility). An occupied hex will stop the machine at the step, not at the plan.
   Terrain passability can be checked - it's public and doesn't change */
function chaseSpot(u, tgt) {
  let best = null;
  let bd = 1e9;
  hexAround(tgt.q, tgt.r, 1, function (q, r, d) {
    if (!d || !canPass(q, r)) return;
    const dist = hexDist(u.q, u.r, q, r);
    if (dist < bd) {
      bd = dist;
      best = { q: q, r: r };
    }
  });
  return best;
}
/* ===== what the machine is doing (P46) =====
   The state was smeared across the task's fields (goal, path, jam, home, site, feed),
   and none of it was surfaced in the display: the shuttle moved in silence, and understanding its intent was
   impossible from anywhere - not from the panel, not from the field.

   A separate field is deliberately NOT introduced here. It would duplicate the same signs
   and sooner or later it would diverge from them - one forgotten place would be enough where
   the task gets changed. State is DERIVED from the task, and it has nothing to lie with.

   The order of checks is the rule itself: a moving machine moves, even if it has both
   a site and a target; a working one works; and only the one left without a task waits */
const STATE_BY_TASK = [
  'ram',
  'ram',
  'site',
  'build',
  'feed',
  'feed',
  'jam',
  'jam',
  'goal',
  'heat',
];
function unitState(u) {
  if (u.dead) return 'dead';
  if (u.stuck) return 'stuck';
  /* not enough hands: the machine wanted to act, but the channel was busy with others.
     State is derived from the same flag that the world used to stop it
     (zaria-hands.js) - a second flag is not introduced here */
  if (u.mute) return 'mute';
  if (u.work) return 'build';
  const t = u.task;
  if (!t) return 'wait';
  if (t.path && t.path.length) return t.ram ? 'ram' : t.home ? 'home' : 'walk';
  for (let i = 0; i < STATE_BY_TASK.length; i += 2) {
    if (t[STATE_BY_TASK[i]]) return STATE_BY_TASK[i + 1];
  }
  return 'wait';
}

/* ===== what the machine does per tick =====
   The Warden has fewer things to do: it doesn't warm up, doesn't shut down, and doesn't build - it walks and
   answers. Splitting this into branches inside the tick would mean keeping the rule
   "who can do what" not where it's read */
function simActs(u) {
  if (u.p === KEEPER) {
    if (u.mute) return; /* not enough hands: it stands and stays silent this tick */
    /* it needs warmup for exactly the reason the canon gives the core first priority:
       to get its needle back. It has no interference and no building, and never will - its
       response as a machine is one, the ram (zaria/09-smotritel.md), and its network is
       a ready-made ring, there's nothing to build in it */
    simStep(u);
    simHeat(u);
    return;
  }
  simLeash(u);
  /* the tether is always counted: connection to the network is not a command, and the autonomy reserve
     drains for a silent machine exactly the same way as for a led one */
  if (u.mute) return;
  simStep(u);
  simHeat(u);
  simJam(u);
  simWork(u);
}

'use strict';
/* Zaria / core :: sim-heat
   warm-up and jamming: how a needle changes owner and how it gets jammed

   CORE. The world and its rules. This is the layer that will one day replace
   the real engine package: it doesn't depend on display.

   Extracted from zaria-sim-act.js at stage 0 of the 2026-09-12 world shift, when
   the rule "both finished in the same tick - nobody" moved the owner change out of the
   unit loop into a separate tick resolution, and the file outgrew its ceiling. The law is the same as
   the neighbor's: work costs stillness - the warming Weaver and the jamming Blade
   stand still and are vulnerable exactly when they're doing their job.

   Parts load IN ORDER from index.html and share a single lexical
   scope: there are deliberately no modules - the demo must open with a double
   click from file://. The order in the markup must not be changed.
   ============================================================ */

/* ===== warm-up and jamming ===== */
function simHeat(u) {
  const w = SIM.world;
  if (u.stuck) return;
  const key = hexKey(u.q, u.r);
  if (!canHeat(u, key, w)) return;
  const owner = w.own[key];
  /* a silent enemy needle counts at draw price: a jam and a cut stop being
     just a denial of income and become an incursion onto the land */
  const need = heatNeed(owner, owner && !(w.lit[owner] || {})[key], w);
  /* warm-up is counted separately for EACH player: as many as three shuttles of
     different factions can stand at the mast, and whoever finishes first wins. The first version
     reset the counter whenever the warmer changed - three shuttles on one cell
     kept resetting each other forever, and the fight locked into a clinch (measured) */
  const h = w.heat[key] || (w.heat[key] = {});
  /* a player's contribution is no more than +1 per tick per needle: two Weavers don't warm twice
     as fast (canon 3.3; stage 7 of the 2026-09-12 shift). The cooling of enemy
     records isn't here, but happens all at once per tick in simHeatCool: everyone melts who
     nobody warmed this tick, not only those whose needle has an opponent standing at it */
  const tag = key + '|' + u.p;
  if (!HEAT_TICK[tag]) {
    HEAT_TICK[tag] = 1;
    h[u.p] = (h[u.p] || 0) + 1;
  }
  if (h[u.p] < need) return;
  /* finished - but the owner doesn't change here, only after the loop over all units: otherwise
     the race between two players for one needle would be decided by their position in the unit list */
  HEAT_DONE.push(key, u.p);

/* ===== finished warm-ups for the tick: "both finished in the same tick - nobody" =====

/* ===== WHAT HAPPENS HERE =====

   anyone else's, and the price paid doesn't come out either - in Vickrey it IS
   the losing bid, and publishing it would turn the sealing into a lie
   (D6 section 6). The winner learns the price from their own deduction.

   The trade-off the mechanic exists for: ENERGY IS ONE for both the bid and the
   hull (Blade 50, Weaver 90, needle 60). That's why the deduction happens in phase 2 -
   BEFORE the build phase - and that's not an implementation detail: energy spent on

  if (!Number.isInteger(ord.amount) || ord.amount < 0) return 'торги';
  const l = LOTS[ord.lot];
